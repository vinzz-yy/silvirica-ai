name: Security & Production Readiness CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev] ruff bandit pip-audit

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check silvirica/ tests/

      - name: Run Bandit Security Analysis
        run: |
          bandit -r silvirica/ -ll -ii

      - name: Run Dependency Vulnerability Audit
        run: |
          pip-audit --desc on

      - name: Run Silvirica Security & Unit Tests
        run: |
          pytest tests/ -v --tb=short
