[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silvirica-ai"
version = "0.1.0"
description = "Universal AI Intelligence Enhancement Runtime: Low-Token, Fast, Multi-IDE, Multi-Agent, Memory, Graph, Skills, Security, UI/UX, Model Routing"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Silvirica AI Team"}
]
keywords = ["ai", "agents", "ide", "context-optimization", "token-reduction", "mcp", "knowledge-graph", "memory"]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
silvirica = "silvirica.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["silvirica*"]
